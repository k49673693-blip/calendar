<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日記＆ヘルスケア カレンダー</title>
  <style>
    :root {
      --primary-color: #4a90e2;
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #e0e0e0;
      --annual-color: #d32f2f;
      --saturday-color: #1976d2;
      --sunday-holiday-color: #d32f2f;
      /* 背景色 */
      --saturday-bg: #eaf4fc;
      --sunday-holiday-bg: #fcebeb;
      /* 今日の日付用のカラー */
      --today-bg: #fff9c4;
      --today-border: #fbc02d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-color); padding: 15px; }
    
    .container { max-width: 900px; margin: 0 auto; }
    
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 15px; background: var(--card-bg); padding: 15px 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    header h1 { font-size: 1.3rem; margin: 0; }
    .nav-group { display: flex; align-items: center; gap: 5px; }
    .header-btns { display: flex; gap: 8px; }
    .btn { padding: 8px 12px; background: var(--primary-color); color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 0.85rem; }
    .nav-btn { background: #eee; color: #333; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 1rem; font-weight: bold; }
    
    /* カレンダーグリッド */
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; background: var(--card-bg); padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); min-height: 400px; }
    .day-header { text-align: center; font-weight: bold; padding: 8px 0; color: #666; font-size: 0.9rem; }
    .day-header.sat { color: var(--saturday-color); }
    .day-header.sun { color: var(--sunday-holiday-color); }

    .day-cell { min-height: 105px; background: #fff; border: 1px solid var(--border-color); border-radius: 5px; padding: 4px; cursor: pointer; display: flex; flex-direction: column; }
    
    /* 土日・祝日の背景色 */
    .day-cell.sat-cell { background-color: var(--saturday-bg); }
    .day-cell.sun-holiday-cell { background-color: var(--sunday-holiday-bg); }

    /* 今日ハイライト（最優先） */
    .day-cell.is-today { background-color: var(--today-bg) !important; border: 2px solid var(--today-border); }
    .is-today .date-num span:first-child { background: var(--today-border); color: #000; padding: 2px 6px; border-radius: 10px; }

    .date-num { font-weight: bold; font-size: 0.9rem; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
    .date-num.sat { color: var(--saturday-color); }
    .date-num.sun-holiday { color: var(--sunday-holiday-color); }
    .holiday-name { font-size: 0.65rem; font-weight: normal; margin-left: 2px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }

    /* バッジ */
    .event-badge { font-size: 0.72rem; padding: 2px 4px; border-radius: 3px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .annual-badge { background-color: #ffebee; color: var(--annual-color); border: 1px solid #ffcdd2; font-weight: bold; }
    .regular-badge { background-color: #e3f2fd; color: #1976d2; }
    .health-badge { font-size: 0.68rem; color: #e65100; background: #fff3e0; padding: 1px 3px; border-radius: 3px; margin-top: auto; }
    .diary-indicator { font-size: 0.68rem; color: #2e7d32; background: #e8f5e9; padding: 1px 3px; border-radius: 3px; margin-top: 2px; }

    /* モーダル */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal.active { display: flex; }
    .modal-content { background: white; padding: 20px; border-radius: 10px; width: 92%; max-width: 550px; max-height: 90vh; overflow-y: auto; }
    .modal-content h2 { margin-bottom: 12px; font-size: 1.1rem; }
    
    form { display: flex; flex-direction: column; gap: 10px; }
    .form-row { display: flex; gap: 10px; }
    .form-group { flex: 1; }
    label { font-size: 0.8rem; font-weight: bold; color: #555; display: block; margin-bottom: 3px; }
    input[type="text"], input[type="number"], textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; }
    textarea { height: 80px; resize: vertical; }
    
    .modal-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
    .btn-save { background: var(--primary-color); color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    .btn-cancel { background: #ccc; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    .annual-list { margin-top: 15px; border-top: 1px solid #ddd; padding-top: 10px; }
    .annual-item { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid #eee; font-size: 0.85rem; }
    .btn-delete { background: #ff5252; color: white; border: none; padding: 2px 6px; border-radius: 3px; cursor: pointer; font-size: 0.75rem; }

    .span-selector { display: flex; gap: 5px; margin-bottom: 15px; }
    .span-btn { flex: 1; padding: 6px; border: 1px solid var(--primary-color); background: white; color: var(--primary-color); border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
    .span-btn.active { background: var(--primary-color); color: white; }
    #chart-container { width: 100%; height: 260px; border: 1px solid #eee; border-radius: 5px; background: #fafafa; overflow: hidden; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="nav-group">
      <button class="nav-btn" id="prev-month">&lt;</button>
      <span id="month-display" style="font-size: 1.1rem; font-weight: bold; margin: 0 8px;">読込中...</span>
      <button class="nav-btn" id="next-month">&gt;</button>
    </div>
    <h1>日記＆ヘルスケア</h1>
    <div class="header-btns">
      <button class="btn" id="open-graph-modal" style="background:#2e7d32;">📊 グラフ</button>
      <button class="btn" id="open-annual-modal">★ 恒例設定</button>
    </div>
  </header>

  <div class="calendar-grid" id="calendar"></div>
</div>

<div class="modal" id="day-modal">
  <div class="modal-content">
    <h2 id="modal-date-title"></h2>
    <form id="day-form">
      <div><label>本日の予定</label><input type="text" id="event-input"></div>
      <div class="form-row">
        <div class="form-group"><label>体重 (kg)</label><input type="number" step="0.1" id="weight-input"></div>
        <div class="form-group"><label>体脂肪率 (%)</label><input type="number" step="0.1" id="fat-input"></div>
      </div>
      <div><label>日記</label><textarea id="diary-input"></textarea></div>
      <div class="modal-buttons">
        <button type="button" class="btn-cancel" id="close-day-modal">キャンセル</button>
        <button type="submit" class="btn-save">保存</button>
      </div>
    </form>
  </div>
</div>

<div class="modal" id="annual-modal">
  <div class="modal-content">
    <h2>毎年恒例の設定</h2>
    <form id="annual-form">
      <div class="form-row">
        <div class="form-group" style="flex: 0.4;"><label>月日(MM-DD)</label><input type="text" id="annual-date" placeholder="04-15" required></div>
        <div class="form-group"><label>予定名</label><input type="text" id="annual-title" required></div>
      </div>
      <button type="submit" class="btn-save" style="margin-top: 5px;">追加</button>
    </form>
    <div class="annual-list">
      <h3>登録一覧</h3><div id="annual-items-container"></div>
    </div>
    <div class="modal-buttons"><button type="button" class="btn-cancel" id="close-annual-modal">閉じる</button></div>
  </div>
</div>

<div class="modal" id="graph-modal">
  <div class="modal-content" style="max-width: 700px;">
    <h2>推移グラフ</h2>
    <div class="span-selector">
      <button class="span-btn" data-span="week">1週間</button>
      <button class="span-btn active" data-span="month">1ヶ月</button>
      <button class="span-btn" data-span="year">1年</button>
    </div>
    <div id="chart-container"></div>
    <div class="modal-buttons"><button type="button" class="btn-cancel" id="close-graph-modal">閉じる</button></div>
  </div>
</div>

<script>
(function() {
  var currentDate = new Date();
  var today = new Date();
  var selectedDateStr = '';
  var currentSpan = 'month';
  var STORAGE_KEY_DAYS = 'calendar_diary_days';
  var STORAGE_KEY_ANNUAL = 'calendar_diary_annual';

  function safeAddEvent(id, eventType, callback) {
    var el = document.getElementById(id);
    if (el) { el.addEventListener(eventType, callback); }
  }

  function safeGetStorage(key, def) {
    try { return JSON.parse(localStorage.getItem(key) || JSON.stringify(def)); }
    catch(e) { return def; }
  }
  function safeSetStorage(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
  }
  
  function getDayData() { return safeGetStorage(STORAGE_KEY_DAYS, {}); }
  function getAnnualData() { return safeGetStorage(STORAGE_KEY_ANNUAL, []); }

  function getJapaneseHoliday(month, day) {
    var mm = (month < 10 ? '0' : '') + month;
    var dd = (day < 10 ? '0' : '') + day;
    var mmdd = mm + '-' + dd;
    var fixedHolidays = {
      '01-01': '元日',
      '02-11': '建国記念の日',
      '02-23': '天皇誕生日',
      '04-29': '昭和の日',
      '05-03': '憲法記念日',
      '05-04': 'みどりの日',
      '05-05': 'こどもの日',
      '08-11': '山の日',
      '11-03': '文化の日',
      '11-23': '勤労感謝の日'
    };
    return fixedHolidays[mmdd] || null;
  }

  function renderCalendar() {
    try {
      var calendarEl = document.getElementById('calendar');
      var monthDisplay = document.getElementById('month-display');
      if (!calendarEl) return; 

      calendarEl.innerHTML = '';
      var year = currentDate.getFullYear();
      var month = currentDate.getMonth(); // 0〜11
      
      if (monthDisplay) {
        monthDisplay.textContent = year + '年 ' + (month + 1) + '月';
      }

      var daysOfWeek = [{n:'日',c:'sun'}, {n:'月',c:''}, {n:'火',c:''}, {n:'水',c:''}, {n:'木',c:''}, {n:'金',c:''}, {n:'土',c:'sat'}];
      daysOfWeek.forEach(function(d) {
        var h = document.createElement('div');
        h.className = 'day-header ' + d.c;
        h.textContent = d.n;
        calendarEl.appendChild(h);
      });

      var firstDay = new Date(year, month, 1).getDay();
      var lastDate = new Date(year, month + 1, 0).getDate();
      for (var i = 0; i < firstDay; i++) {
        calendarEl.appendChild(document.createElement('div'));
      }

      var dayData = getDayData();
      var annualData = getAnnualData();
      var ty = today.getFullYear(), tm = today.getMonth(), td = today.getDate();

      for (var date = 1; date <= lastDate; date++) {
        var cell = document.createElement('div');
        
        var dw = new Date(year, month, date).getDay();
        var hol = getJapaneseHoliday(month + 1, date);

        var isSunHol = (dw === 0 || hol);
        var isSat = (dw === 6);
        
        cell.className = 'day-cell';
        if (isSunHol) { cell.classList.add('sun-holiday-cell'); }
        else if (isSat) { cell.classList.add('sat-cell'); }

        if (year === ty && month === tm && date === td) {
          cell.classList.add('is-today');
        }

        var mm = (month + 1 < 10 ? '0' : '') + (month + 1);
        var dd = (date < 10 ? '0' : '') + date;
        var fKey = year + '-' + mm + '-' + dd;
        var mmdd = mm + '-' + dd;
        
        var dNum = document.createElement('div');
        dNum.className = 'date-num ' + (isSunHol ? 'sun-holiday' : (isSat ? 'sat' : ''));
        dNum.innerHTML = '<span>' + date + '</span>' + (hol ? '<span class="holiday-name">' + hol + '</span>' : '');
        cell.appendChild(dNum);

        if (Array.isArray(annualData)) {
          annualData.filter(function(a){return a && a.mmdd === mmdd;}).forEach(function(a){
            var b = document.createElement('div'); b.className = 'event-badge annual-badge'; b.textContent = '★ ' + a.title; cell.appendChild(b);
          });
        }

        if (dayData[fKey] && dayData[fKey].event) {
          var b = document.createElement('div'); b.className = 'event-badge regular-badge'; b.textContent = dayData[fKey].event; cell.appendChild(b);
        }
        if (dayData[fKey] && (dayData[fKey].weight || dayData[fKey].fat)) {
          var b = document.createElement('div'); b.className = 'health-badge'; b.textContent = '⚖️ ' + (dayData[fKey].weight||'') + ' ' + (dayData[fKey].fat||''); cell.appendChild(b);
        }
        if (dayData[fKey] && dayData[fKey].diary) {
          var b = document.createElement('div'); b.className = 'diary-indicator'; b.textContent = '📖 日記あり'; cell.appendChild(b);
        }

        (function(k){ cell.onclick = function(){ openDayModal(k); }; })(fKey);
        calendarEl.appendChild(cell);
      }
    } catch (err) {
      console.error('calendar render error:', err);
    }
  }

  function openDayModal(dStr) {
    selectedDateStr = dStr;
    var dt = document.getElementById('modal-date-title');
    if(dt) dt.textContent = dStr;
    var info = getDayData()[dStr] || {};
    if(document.getElementById('event-input')) document.getElementById('event-input').value = info.event || '';
    if(document.getElementById('weight-input')) document.getElementById('weight-input').value = info.weight || '';
    if(document.getElementById('fat-input')) document.getElementById('fat-input').value = info.fat || '';
    if(document.getElementById('diary-input')) document.getElementById('diary-input').value = info.diary || '';
    var m = document.getElementById('day-modal'); if(m) m.classList.add('active');
  }

  function renderAnnualList() {
    var c = document.getElementById('annual-items-container');
    if(!c) return;
    c.innerHTML = '';
    getAnnualData().forEach(function(i) {
      var d = document.createElement('div'); d.className = 'annual-item';
      d.innerHTML = '<span>[' + i.mmdd + '] ' + i.title + '</span><button class="btn-delete" onclick="window.deleteAnnual(' + i.id + ')">削除</button>';
      c.appendChild(d);
    });
  }

  window.deleteAnnual = function(id) {
    safeSetStorage(STORAGE_KEY_ANNUAL, getAnnualData().filter(function(i){return i.id !== id;}));
    renderAnnualList(); renderCalendar();
  };

  // --- SVGグラフ描画処理 ---
  function renderSvgChart() {
    try {
      var container = document.getElementById('chart-container');
      if (!container) return;
      container.innerHTML = '';

      var dayData = getDayData();
      var keys = Object.keys(dayData).sort();

      var now = new Date();
      if (currentSpan === 'week') {
        var target = new Date(); target.setDate(now.getDate() - 7);
        keys = keys.filter(function(k) { return new Date(k) >= target; });
      } else if (currentSpan === 'month') {
        var target = new Date(); target.setMonth(now.getMonth() - 1);
        keys = keys.filter(function(k) { return new Date(k) >= target; });
      } else if (currentSpan === 'year') {
        var target = new Date(); target.setFullYear(now.getFullYear() - 1);
        keys = keys.filter(function(k) { return new Date(k) >= target; });
      }

      var validData = keys.map(function(k) {
        return {
          date: k,
          w: parseFloat(dayData[k].weight) || null,
          f: parseFloat(dayData[k].fat) || null
        };
      }).filter(function(d) { return d.w !== null || d.f !== null; });

      if (validData.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding-top:100px; color:#999;">データがありません</div>';
        return;
      }

      var width = container.clientWidth || 600;
      var height = 260;
      
      var padLeft = 35;
      var padRight = 35;
      var padTop = 30;
      var padBottom = 25;
      var chartW = width - padLeft - padRight;
      var chartH = height - padTop - padBottom;

      var wValues = validData.map(function(d) { return d.w; }).filter(function(v) { return v !== null; });
      var fValues = validData.map(function(d) { return d.f; }).filter(function(v) { return v !== null; });

      var minW = wValues.length ? Math.floor(Math.min.apply(null, wValues) - 1) : 0;
      var maxW = wValues.length ? Math.ceil(Math.max.apply(null, wValues) + 1) : 100;
      var minF = fValues.length ? Math.floor(Math.min.apply(null, fValues) - 1) : 0;
      var maxF = fValues.length ? Math.ceil(Math.max.apply(null, fValues) + 1) : 50;

      var svgHtml = '<svg width="100%" height="' + height + '" viewBox="0 0 ' + width + ' ' + height + '" style="background:#fff;">';
      
      svgHtml += '<line x1="' + padLeft + '" y1="' + (height - padBottom) + '" x2="' + (width - padRight) + '" y2="' + (height - padBottom) + '" stroke="#ccc" />';
      svgHtml += '<line x1="' + padLeft + '" y1="' + padTop + '" x2="' + padLeft + '" y2="' + (height - padBottom) + '" stroke="#ccc" />';
      svgHtml += '<line x1="' + (width - padRight) + '" y1="' + padTop + '" x2="' + (width - padRight) + '" y2="' + (height - padBottom) + '" stroke="#ccc" />';
      
      svgHtml += '<text x="' + padLeft + '" y="20" fill="#1976d2" font-size="12">■ 体重(kg)</text>';
      svgHtml += '<text x="' + (padLeft + 90) + '" y="20" fill="#f57c00" font-size="12">■ 体脂肪率(%)</text>';

      var split = 4;
      for (var i = 0; i <= split; i++) {
         var yPos = (height - padBottom) - (chartH * (i / split));
         var valW = (minW + (maxW - minW) * (i / split)).toFixed(1);
         var valF = (minF + (maxF - minF) * (i / split)).toFixed(1);
         
         svgHtml += '<line x1="' + padLeft + '" y1="' + yPos + '" x2="' + (width - padRight) + '" y2="' + yPos + '" stroke="#eee" />';
         svgHtml += '<text x="' + (padLeft - 5) + '" y="' + (yPos + 4) + '" fill="#1976d2" font-size="10" text-anchor="end">' + valW + '</text>';
         svgHtml += '<text x="' + (width - padRight + 5) + '" y="' + (yPos + 4) + '" fill="#f57c00" font-size="10" text-anchor="start">' + valF + '</text>';
      }

      var stepX = validData.length > 1 ? chartW / (validData.length - 1) : chartW / 2;
      var pointsW = [];
      var pointsF = [];

      validData.forEach(function(d, i) {
        var x = validData.length === 1 ? padLeft + chartW / 2 : padLeft + i * stepX;

        var dMatch = d.date.match(/-(\d{2})-(\d{2})$/);
        var labelX = dMatch ? parseInt(dMatch[1],10) + '/' + parseInt(dMatch[2],10) : '';
        
        var showLabel = true;
        if (validData.length > 15 && i % 2 !== 0 && i !== validData.length - 1) showLabel = false;
        if (validData.length > 30 && i % 4 !== 0 && i !== validData.length - 1) showLabel = false;
        
        if (showLabel) {
           svgHtml += '<text x="' + x + '" y="' + (height - padBottom + 15) + '" fill="#666" font-size="10" text-anchor="middle">' + labelX + '</text>';
        }

        if (d.w !== null) {
          var yW = (height - padBottom) - ((d.w - minW) / (maxW - minW || 1)) * chartH;
          pointsW.push(x + ',' + yW);
          svgHtml += '<circle cx="' + x + '" cy="' + yW + '" r="3" fill="#1976d2" />';
        }
        if (d.f !== null) {
          var yF = (height - padBottom) - ((d.f - minF) / (maxF - minF || 1)) * chartH;
          pointsF.push(x + ',' + yF);
          svgHtml += '<circle cx="' + x + '" cy="' + yF + '" r="3" fill="#f57c00" />';
        }
      });

      if (pointsW.length > 1) {
        svgHtml += '<polyline points="' + pointsW.join(' ') + '" fill="none" stroke="#1976d2" stroke-width="2" />';
      }
      if (pointsF.length > 1) {
        svgHtml += '<polyline points="' + pointsF.join(' ') + '" fill="none" stroke="#f57c00" stroke-width="2" />';
      }

      svgHtml += '</svg>';
      container.innerHTML = svgHtml;
    } catch (err) {
      console.error('chart render error:', err);
    }
  }

  function

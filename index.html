<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日記カレンダー</title>
  <style>
    :root {
      --primary-color: #4a90e2;
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #e0e0e0;
      --annual-color: #e74c3c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-color); padding: 20px; }
    
    .container { max-width: 900px; margin: 0 auto; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--card-bg); padding: 15px 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    header h1 { font-size: 1.5rem; }
    header button { padding: 8px 16px; background: var(--primary-color); color: white; border: none; border-radius: 5px; cursor: pointer; }

    .nav-btn { background: #eee; color: #333; border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 1rem; }

    /* カレンダーグリッド */
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; background: var(--card-bg); padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .day-header { text-align: center; font-weight: bold; padding: 10px 0; color: #666; }
    
    .day-cell { min-height: 100px; background: #fff; border: 1px solid var(--border-color); border-radius: 5px; padding: 5px; cursor: pointer; transition: background 0.2s; display: flex; flex-direction: column; }
    .day-cell:hover { background: #f0f7ff; }
    .day-cell .date-num { font-weight: bold; font-size: 0.9rem; margin-bottom: 5px; }
    
    /* 予定・日記バッジ */
    .event-badge { font-size: 0.75rem; padding: 2px 4px; border-radius: 3px; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .annual-badge { background-color: #ffebee; color: var(--annual-color); border: 1px solid #ffcdd2; font-weight: bold; }
    .regular-badge { background-color: #e3f2fd; color: #1976d2; }
    .diary-indicator { font-size: 0.7rem; color: #2e7d32; background: #e8f5e9; padding: 2px 4px; border-radius: 3px; margin-top: auto; }

    /* モーダル */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal.active { display: flex; }
    .modal-content { background: white; padding: 25px; border-radius: 10px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
    .modal-content h2 { margin-bottom: 15px; font-size: 1.2rem; }
    
    form { display: flex; flex-direction: column; gap: 12px; }
    label { font-size: 0.85rem; font-weight: bold; color: #555; }
    input[type="text"], input[type="date"], textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.95rem; }
    textarea { height: 100px; resize: vertical; }
    
    .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; }
    .btn-save { background: var(--primary-color); color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    .btn-cancel { background: #ccc; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }

    .annual-list { margin-top: 15px; border-top: 1px solid #ddd; padding-top: 10px; }
    .annual-item { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid #eee; }
    .btn-delete { background: #ff5252; color: white; border: none; padding: 2px 6px; border-radius: 3px; cursor: pointer; font-size: 0.8rem; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <button class="nav-btn" id="prev-month">&lt;</button>
      <span id="month-display" style="font-size: 1.2rem; font-weight: bold; margin: 0 10px;"></span>
      <button class="nav-btn" id="next-month">&gt;</button>
    </div>
    <h1>日記カレンダー</h1>
    <button id="open-annual-modal">毎年恒例の設定</button>
  </header>

  <div class="calendar-grid" id="calendar"></div>
</div>

<!-- 日付詳細・日記編集モーダル -->
<div class="modal" id="day-modal">
  <div class="modal-content">
    <h2 id="modal-date-title"></h2>
    <form id="day-form">
      <div>
        <label>本日の予定</label>
        <input type="text" id="event-input" placeholder="例: 買い物、会議">
      </div>
      <div>
        <label>日記</label>
        <textarea id="diary-input" placeholder="今日の出来事や感想を書く..."></textarea>
      </div>
      <div class="modal-buttons">
        <button type="button" class="btn-cancel" id="close-day-modal">キャンセル</button>
        <button type="submit" class="btn-save">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- 恒例行事設定モーダル -->
<div class="modal" id="annual-modal">
  <div class="modal-content">
    <h2>毎年恒例の設定（誕生日・記念日・命日など）</h2>
    <form id="annual-form">
      <div>
        <label>月日 (MM-DD)</label>
        <input type="text" id="annual-date" placeholder="04-15 (例: 4月15日)" pattern="\d{2}-\d{2}" required>
      </div>
      <div>
        <label>予定名</label>
        <input type="text" id="annual-title" placeholder="例: ○○の誕生日" required>
      </div>
      <button type="submit" class="btn-save" style="margin-top: 5px;">追加</button>
    </form>

    <div class="annual-list">
      <h3>登録一覧</h3>
      <div id="annual-items-container"></div>
    </div>

    <div class="modal-buttons">
      <button type="button" class="btn-cancel" id="close-annual-modal">閉じる</button>
    </div>
  </div>
</div>

<script>
  // ローカルストレージキー
  const STORAGE_KEY_DAYS = 'calendar_diary_days';
  const STORAGE_KEY_ANNUAL = 'calendar_diary_annual';

  let currentDate = new Date();
  let selectedDateStr = '';

  // データ取得
  const getDayData = () => JSON.parse(localStorage.getItem(STORAGE_KEY_DAYS) || '{}');
  const getAnnualData = () => JSON.parse(localStorage.getItem(STORAGE_KEY_ANNUAL) || '[]');

  // データ保存
  const saveDayData = (data) => localStorage.setItem(STORAGE_KEY_DAYS, JSON.stringify(data));
  const saveAnnualData = (data) => localStorage.setItem(STORAGE_KEY_ANNUAL, JSON.stringify(data));

  // カレンダー描画
  function renderCalendar() {
    const calendarEl = document.getElementById('calendar');
    const monthDisplay = document.getElementById('month-display');
    calendarEl.innerHTML = '';

    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    monthDisplay.textContent = `${year}年 ${month + 1}月`;

    // 曜日ヘッダー
    const daysOfWeek = ['日', '月', '火', '水', '木', '金', '土'];
    daysOfWeek.forEach(d => {
      const header = document.createElement('div');
      header.className = 'day-header';
      header.textContent = d;
      calendarEl.appendChild(header);
    });

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();

    // 空白セル
    for (let i = 0; i < firstDay; i++) {
      const empty = document.createElement('div');
      calendarEl.appendChild(empty);
    }

    const dayData = getDayData();
    const annualData = getAnnualData();

    // 日付セル生成
    for (let date = 1; date <= lastDate; date++) {
      const cell = document.createElement('div');
      cell.className = 'day-cell';
      
      const monthStr = String(month + 1).padStart(2, '0');
      const dateStr = String(date).padStart(2, '0');
      const fullDateKey = `${year}-${monthStr}-${dateStr}`;
      const mmddKey = `${monthStr}-${dateStr}`;

      const dateNum = document.createElement('div');
      dateNum.className = 'date-num';
      dateNum.textContent = date;
      cell.appendChild(dateNum);

      // 1. 毎年変わらない予定（恒例行事）の描画
      const annuals = annualData.filter(a => a.mmdd === mmddKey);
      annuals.forEach(a => {
        const badge = document.createElement('div');
        badge.className = 'event-badge annual-badge';
        badge.textContent = `★ ${a.title}`;
        cell.appendChild(badge);
      });

      // 2. 通常の予定の描画
      if (dayData[fullDateKey] && dayData[fullDateKey].event) {
        const badge = document.createElement('div');
        badge.className = 'event-badge regular-badge';
        badge.textContent = dayData[fullDateKey].event;
        cell.appendChild(badge);
      }

      // 3. 日記が存在するか描画
      if (dayData[fullDateKey] && dayData[fullDateKey].diary) {
        const diaryIndicator = document.createElement('div');
        diaryIndicator.className = 'diary-indicator';
        diaryIndicator.textContent = '📖 日記あり';
        cell.appendChild(diaryIndicator);
      }

      // タップでモーダルオープン
      cell.addEventListener('click', () => openDayModal(fullDateKey));
      calendarEl.appendChild(cell);
    }
  }

  // モーダル操作: 日付（日記・予定）
  function openDayModal(dateStr) {
    selectedDateStr = dateStr;
    document.getElementById('modal-date-title').textContent = `${dateStr} の記録`;
    
    const dayData = getDayData();
    const currentInfo = dayData[dateStr] || { event: '', diary: '' };

    document.getElementById('event-input').value = currentInfo.event || '';
    document.getElementById('diary-input').value = currentInfo.diary || '';

    document.getElementById('day-modal').classList.add('active');
  }

  document.getElementById('close-day-modal').addEventListener('click', () => {
    document.getElementById('day-modal').classList.remove('active');
  });

  document.getElementById('day-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const dayData = getDayData();
    const event = document.getElementById('event-input').value.trim();
    const diary = document.getElementById('diary-input').value.trim();

    if (event || diary) {
      dayData[selectedDateStr] = { event, diary };
    } else {
      delete dayData[selectedDateStr];
    }

    saveDayData(dayData);
    document.getElementById('day-modal').classList.remove('active');
    renderCalendar();
  });

  // モーダル操作: 毎年恒例行事
  document.getElementById('open-annual-modal').addEventListener('click', () => {
    renderAnnualList();
    document.getElementById('annual-modal').classList.add('active');
  });

  document.getElementById('close-annual-modal').addEventListener('click', () => {
    document.getElementById('annual-modal').classList.remove('active');
  });

  document.getElementById('annual-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const mmdd = document.getElementById('annual-date').value.trim();
    const title = document.getElementById('annual-title').value.trim();

    if (mmdd && title) {
      const annualData = getAnnualData();
      annualData.push({ id: Date.now(), mmdd, title });
      saveAnnualData(annualData);

      document.getElementById('annual-date').value = '';
      document.getElementById('annual-title').value = '';
      renderAnnualList();
      renderCalendar();
    }
  });

  function renderAnnualList() {
    const container = document.getElementById('annual-items-container');
    container.innerHTML = '';
    const annualData = getAnnualData();

    annualData.forEach(item => {
      const div = document.createElement('div');
      div.className = 'annual-item';
      div.innerHTML = `
        <span>[${item.mmdd}] ${item.title}</span>
        <button class="btn-delete" onclick="deleteAnnual(${item.id})">削除</button>
      `;
      container.appendChild(div);
    });
  }

  window.deleteAnnual = function(id) {
    let annualData = getAnnualData();
    annualData = annualData.filter(item => item.id !== id);
    saveAnnualData(annualData);
    renderAnnualList();
    renderCalendar();
  };

  // 月切り替え
  document.getElementById('prev-month').addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar();
  });

  document.getElementById('next-month').addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar();
  });

  // 初期化
  renderCalendar();
</script>

</body>
</html>

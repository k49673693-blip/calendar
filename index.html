<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日記＆ヘルスケア カレンダー</title>
  <style>
    :root {
      --primary-color: #4a90e2;
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #e0e0e0;
      --annual-color: #d32f2f;
      --saturday-color: #1976d2;
      --sunday-holiday-color: #d32f2f;
      --today-bg: #fffde7;
      --today-border: #fbc02d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-color); padding: 15px; }
    
    .container { max-width: 900px; margin: 0 auto; }
    
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 15px; background: var(--card-bg); padding: 15px 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    header h1 { font-size: 1.3rem; }
    .nav-group { display: flex; align-items: center; gap: 5px; }
    .header-btns { display: flex; gap: 8px; }
    .btn { padding: 8px 12px; background: var(--primary-color); color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 0.85rem; }
    .nav-btn { background: #eee; color: #333; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 1rem; font-weight: bold; }
    .nav-btn:hover { background: #ddd; }

    /* カレンダーグリッド */
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; background: var(--card-bg); padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .day-header { text-align: center; font-weight: bold; padding: 8px 0; color: #666; font-size: 0.9rem; }
    .day-header.sat { color: var(--saturday-color); }
    .day-header.sun { color: var(--sunday-holiday-color); }

    .day-cell { min-height: 105px; background: #fff; border: 1px solid var(--border-color); border-radius: 5px; padding: 4px; cursor: pointer; transition: background 0.2s; display: flex; flex-direction: column; }
    .day-cell:hover { background: #f0f7ff; }
    
    /* 今日ハイライト */
    .day-cell.is-today { background-color: var(--today-bg); border: 2px solid var(--today-border); }

    .date-num { font-weight: bold; font-size: 0.9rem; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
    .date-num.sat { color: var(--saturday-color); }
    .date-num.sun-holiday { color: var(--sunday-holiday-color); }
    .holiday-name { font-size: 0.65rem; font-weight: normal; margin-left: 2px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }

    /* バッジ */
    .event-badge { font-size: 0.72rem; padding: 2px 4px; border-radius: 3px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .annual-badge { background-color: #ffebee; color: var(--annual-color); border: 1px solid #ffcdd2; font-weight: bold; }
    .regular-badge { background-color: #e3f2fd; color: #1976d2; }
    .health-badge { font-size: 0.68rem; color: #e65100; background: #fff3e0; padding: 1px 3px; border-radius: 3px; margin-top: auto; }
    .diary-indicator { font-size: 0.68rem; color: #2e7d32; background: #e8f5e9; padding: 1px 3px; border-radius: 3px; margin-top: 2px; }

    /* モーダル */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal.active { display: flex; }
    .modal-content { background: white; padding: 20px; border-radius: 10px; width: 92%; max-width: 550px; max-height: 90vh; overflow-y: auto; }
    .modal-content h2 { margin-bottom: 12px; font-size: 1.1rem; }
    
    form { display: flex; flex-direction: column; gap: 10px; }
    .form-row { display: flex; gap: 10px; }
    .form-group { flex: 1; }
    label { font-size: 0.8rem; font-weight: bold; color: #555; display: block; margin-bottom: 3px; }
    input[type="text"], input[type="number"], textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; }
    textarea { height: 80px; resize: vertical; }
    
    .modal-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
    .btn-save { background: var(--primary-color); color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    .btn-cancel { background: #ccc; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }

    .annual-list { margin-top: 15px; border-top: 1px solid #ddd; padding-top: 10px; }
    .annual-item { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid #eee; font-size: 0.85rem; }
    .btn-delete { background: #ff5252; color: white; border: none; padding: 2px 6px; border-radius: 3px; cursor: pointer; font-size: 0.75rem; }

    .span-selector { display: flex; gap: 5px; margin-bottom: 15px; }
    .span-btn { flex: 1; padding: 6px; border: 1px solid var(--primary-color); background: white; color: var(--primary-color); border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
    .span-btn.active { background: var(--primary-color); color: white; }

    /* SVG グラフコンテナ */
    #chart-container { width: 100%; height: 260px; border: 1px solid #eee; border-radius: 5px; background: #fafafa; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="nav-group">
      <button class="nav-btn" id="prev-month">&lt;</button>
      <span id="month-display" style="font-size: 1.1rem; font-weight: bold; margin: 0 8px;"></span>
      <button class="nav-btn" id="next-month">&gt;</button>
    </div>
    <h1>日記＆ヘルスケア</h1>
    <div class="header-btns">
      <button class="btn" id="open-graph-modal" style="background:#2e7d32;">📊 グラフ</button>
      <button class="btn" id="open-annual-modal">★ 恒例設定</button>
    </div>
  </header>

  <div class="calendar-grid" id="calendar"></div>
</div>

<!-- 日付詳細モーダル -->
<div class="modal" id="day-modal">
  <div class="modal-content">
    <h2 id="modal-date-title"></h2>
    <form id="day-form">
      <div>
        <label>本日の予定</label>
        <input type="text" id="event-input" placeholder="例: 買い物、会議">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>体重 (kg)</label>
          <input type="number" step="0.1" id="weight-input" placeholder="60.5">
        </div>
        <div class="form-group">
          <label>体脂肪率 (%)</label>
          <input type="number" step="0.1" id="fat-input" placeholder="18.5">
        </div>
      </div>
      <div>
        <label>日記</label>
        <textarea id="diary-input" placeholder="今日の出来事や感想を書く..."></textarea>
      </div>
      <div class="modal-buttons">
        <button type="button" class="btn-cancel" id="close-day-modal">キャンセル</button>
        <button type="submit" class="btn-save">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- 恒例行事設定モーダル -->
<div class="modal" id="annual-modal">
  <div class="modal-content">
    <h2>毎年恒例の設定（誕生日・命日等）</h2>
    <form id="annual-form">
      <div class="form-row">
        <div class="form-group" style="flex: 0.4;">
          <label>月日 (MM-DD)</label>
          <input type="text" id="annual-date" placeholder="04-15" pattern="\d{2}-\d{2}" required>
        </div>
        <div class="form-group">
          <label>予定名</label>
          <input type="text" id="annual-title" placeholder="例: ○○の誕生日" required>
        </div>
      </div>
      <button type="submit" class="btn-save" style="margin-top: 5px;">追加</button>
    </form>

    <div class="annual-list">
      <h3>登録一覧</h3>
      <div id="annual-items-container"></div>
    </div>

    <div class="modal-buttons">
      <button type="button" class="btn-cancel" id="close-annual-modal">閉じる</button>
    </div>
  </div>
</div>

<!-- グラフモーダル -->
<div class="modal" id="graph-modal">
  <div class="modal-content" style="max-width: 700px;">
    <h2>体重・体脂肪率の推移</h2>
    <div class="span-selector">
      <button class="span-btn" data-span="week">1週間</button>
      <button class="span-btn active" data-span="month">1ヶ月</button>
      <button class="span-btn" data-span="year">1年</button>
      <button class="span-btn" data-span="all">全期間</button>
    </div>
    <div id="chart-container"></div>
    <div class="modal-buttons">
      <button type="button" class="btn-cancel" id="close-graph-modal">閉じる</button>
    </div>
  </div>
</div>

<script>
  // 祝日判定ロジック
  function getJapaneseHoliday(year, month, day) {
    var mmdd = (month < 10 ? '0' : '') + month + '-' + (day < 10 ? '0' : '') + day;
    var date = new Date(year, month - 1, day);
    var dayOfWeek = date.getDay();

    var fixedHolidays = {
      '01-01': '元日', '02-11': '建国記念の日', '02-23': '天皇誕生日',
      '04-29': '昭和の日', '05-03': '憲法記念日', '05-04': 'みどりの日',
      '05-05': 'こどもの日', '08-11': '山の日', '11-03': '文化の日', '11-23': '勤労感謝の日'
    };
    if (fixedHolidays[mmdd]) return fixedHolidays[mmdd];

    var nthMonday = Math.floor((day - 1) / 7) + 1;
    if (dayOfWeek === 1) {
      if (month === 1 && nthMonday === 2) return '成人の日';
      if (month === 7 && nthMonday === 3) return '海の日';
      if (month === 9 && nthMonday === 3) return '敬老の日';
      if (month === 10 && nthMonday === 2) return 'スポーツの日';
    }

    if (month === 3) {
      var vernal = Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
      if (day === vernal) return '春分の日';
    }
    if (month === 9) {
      var autumnal = Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
      if (day === autumnal) return '秋分の日';
    }

    if (dayOfWeek === 1) {
      var prevDate = new Date(year, month - 1, day - 1);
      var prevHoliday = getJapaneseHoliday(prevDate.getFullYear(), prevDate.getMonth() + 1, prevDate.getDate());
      if (prevHoliday) return '振替休日';
    }
    return null;
  }

  // ストレージ関連
  var STORAGE_KEY_DAYS = 'calendar_diary_days';
  var STORAGE_KEY_ANNUAL = 'calendar_diary_annual';

  var currentDate = new Date();
  var today = new Date();
  var selectedDateStr = '';
  var currentSpan = 'month';

  function getDayData() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY_DAYS) || '{}'); }
    catch(e) { return {}; }
  }
  function getAnnualData() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY_ANNUAL) || '[]'); }
    catch(e) { return []; }
  }
  function saveDayData(data) { localStorage.setItem(STORAGE_KEY_DAYS, JSON.stringify(data)); }
  function saveAnnualData(data) { localStorage.setItem(STORAGE_KEY_ANNUAL, JSON.stringify(data)); }

  // カレンダーを描画
  function renderCalendar() {
    var calendarEl = document.getElementById('calendar');
    var monthDisplay = document.getElementById('month-display');
    if (!calendarEl || !monthDisplay) return;

    calendarEl.innerHTML = '';

    var year = currentDate.getFullYear();
    var month = currentDate.getMonth();

    monthDisplay.textContent = year + '年 ' + (month + 1) + '月';

    // 曜日ヘッダー
    var daysOfWeek = [
      { name: '日', class: 'sun' }, { name: '月', class: '' }, { name: '火', class: '' },
      { name: '水', class: '' }, { name: '木', class: '' }, { name: '金', class: '' }, { name: '土', class: 'sat' }
    ];
    daysOfWeek.forEach(function(d) {
      var header = document.createElement('div');
      header.className = 'day-header ' + d.class;
      header.textContent = d.name;
      calendarEl.appendChild(header);
    });

    var firstDay = new Date(year, month, 1).getDay();
    var lastDate = new Date(year, month + 1, 0).getDate();

    // 空白セル
    for (var i = 0; i < firstDay; i++) {
      calendarEl.appendChild(document.createElement('div'));
    }

    var dayData = getDayData();
    var annualData = getAnnualData();

    // 当日判定用の文字列
    var todayYear = today.getFullYear();
    var todayMonth = today.getMonth();
    var todayDate = today.getDate();

    // 日付セルを構築
    for (var date = 1; date <= lastDate; date++) {
      var cell = document.createElement('div');
      cell.className = 'day-cell';

      // 今日の日付ハイライト判定
      if (year === todayYear && month === todayMonth && date === todayDate) {
        cell.classList.add('is-today');
      }

      var monthStr = (month + 1 < 10 ? '0' : '') + (month + 1);
      var dateStr = (date < 10 ? '0' : '') + date;
      var fullDateKey = year + '-' + monthStr + '-' + dateStr;
      var mmddKey = monthStr + '-' + dateStr;

      var cellDate = new Date(year, month, date);
      var dayOfWeek = cellDate.getDay();
      var holidayName = getJapaneseHoliday(year, month + 1, date);

      var dateNum = document.createElement('div');
      dateNum.className = 'date-num';

      if (dayOfWeek === 0 || holidayName) {
        dateNum.classList.add('sun-holiday');
      } else if (dayOfWeek === 6) {
        dateNum.classList.add('sat');
      }

      dateNum.innerHTML = '<span>' + date + '</span>' + (holidayName ? '<span class="holiday-name">' + holidayName + '</span>' : '');
      cell.appendChild(dateNum);

      // 毎年恒例行事
      annualData.filter(function(a) { return a.mmdd === mmddKey; }).forEach(function(a) {
        var badge = document.createElement('div');
        badge.className = 'event-badge annual-badge';
        badge.textContent = '★ ' + a.title;
        cell.appendChild(badge);
      });

      // 通常予定
      if (dayData[fullDateKey] && dayData[fullDateKey].event) {
        var badge = document.createElement('div');
        badge.className = 'event-badge regular-badge';
        badge.textContent = dayData[fullDateKey].event;
        cell.appendChild(badge);
      }

      // 体重・体脂肪
      if (dayData[fullDateKey] && (dayData[fullDateKey].weight || dayData[fullDateKey].fat)) {
        var healthBadge = document.createElement('div');
        healthBadge.className = 'health-badge';
        var w = dayData[fullDateKey].weight ? dayData[fullDateKey].weight + 'kg' : '';
        var f = dayData[fullDateKey].fat ? dayData[fullDateKey].fat + '%' : '';
        healthBadge.textContent = ('⚖️ ' + w + ' ' + f).trim();
        cell.appendChild(healthBadge);
      }

      // 日記
      if (dayData[fullDateKey] && dayData[fullDateKey].diary) {
        var diaryIndicator = document.createElement('div');
        diaryIndicator.className = 'diary-indicator';
        diaryIndicator.textContent = '📖 日記あり';
        cell.appendChild(diaryIndicator);
      }

      (function(key) {
        cell.addEventListener('click', function() { openDayModal(key); });
      })(fullDateKey);

      calendarEl.appendChild(cell);
    }
  }

  // 日付詳細モーダル
  function openDayModal(dateStr) {
    selectedDateStr = dateStr;
    document.getElementById('modal-date-title').textContent = dateStr + ' の記録';
    
    var dayData = getDayData();
    var info = dayData[dateStr] || {};

    document.getElementById('event-input').value = info.event || '';
    document.getElementById('weight-input').value = info.weight || '';
    document.getElementById('fat-input').value = info.fat || '';
    document.getElementById('diary-input').value = info.diary || '';

    document.getElementById('day-modal').classList.add('active');
  }

  document.getElementById('close-day-modal').addEventListener('click', function() {
    document.getElementById('day-modal').classList.remove('active');
  });

  document.getElementById('day-form').addEventListener('submit', function(e) {
    e.preventDefault();
    var dayData = getDayData();
    var event = document.getElementById('event-input').value.trim();
    var weight = document.getElementById('weight-input').value;
    var fat = document.getElementById('fat-input').value;
    var diary = document.getElementById('diary-input').value.trim();

    if (event || weight || fat || diary) {
      dayData[selectedDateStr] = { event: event, weight: weight, fat: fat, diary: diary };
    } else {
      delete dayData[selectedDateStr];
    }

    saveDayData(dayData);
    document.getElementById('day-modal').classList.remove('active');
    renderCalendar();
  });

  // 恒例行事モーダル
  document.getElementById('open-annual-modal').addEventListener('click', function() {
    renderAnnualList();
    document.getElementById('annual-modal').classList.add('active');
  });
  document.getElementById('close-annual-modal').addEventListener('click', function() {
    document.getElementById('annual-modal').classList.remove('active');
  });

  document.getElementById('annual-form').addEventListener('submit', function(e) {
    e.preventDefault();
    var mmdd = document.getElementById('annual-date').value.trim();
    var title = document.getElementById('annual-title').value.trim();

    if (mmdd && title) {
      var annualData = getAnnualData();
      annualData.push({ id: Date.now(), mmdd: mmdd, title: title });
      saveAnnualData(annualData);

      document.getElementById('annual-date').value = '';
      document.getElementById('annual-title').value = '';
      renderAnnualList();
      renderCalendar();
    }
  });

  function renderAnnualList() {
    var container = document.getElementById('annual-items-container');
    container.innerHTML = '';
    getAnnualData().forEach(function(item) {
      var div = document.createElement('div');
      div.className = 'annual-item';
      div.innerHTML = '<span>[' + item.mmdd + '] ' + item.title + '</span>' +
        '<button class="btn-delete" onclick="deleteAnnual(' + item.id + ')">削除</button>';
      container.appendChild(div);
    });
  }

  window.deleteAnnual = function(id) {
    saveAnnualData(getAnnualData().filter(function(item) { return item.id !== id; }));
    renderAnnualList();
    renderCalendar();
  };

  // グラフ機能（SVG独自描画）
  document.getElementById('open-graph-modal').addEventListener('click', function() {
    document.getElementById('graph-modal').classList.add('active');
    renderSvgChart();
  });
  document.getElementById('close-graph-modal').addEventListener('click', function() {
    document.getElementById('graph-modal').classList.remove('active');
  });

  document.querySelectorAll('.span-btn').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      document.querySelectorAll('.span-btn').forEach(function(b) { b.classList.remove('active'); });
      e.target.classList.add('active');
      currentSpan = e.target.getAttribute('data-span');
      renderSvgChart();
    });
  });

  function renderSvgChart() {
    var container = document.getElementById('chart-container');
    container.innerHTML = '';

    var dayData = getDayData();
    var keys = Object.keys(dayData).sort();

    var now = new Date();
    if (currentSpan === 'week') {
      var target = new Date(); target.setDate(now.getDate() - 7);
      keys = keys.filter(function(k) { return new Date(k) >= target; });
    } else if (currentSpan === 'month') {
      var target = new Date(); target.setMonth(now.getMonth() - 1);
      keys = keys.filter(function(k) { return new Date(k) >= target; });
    } else if (currentSpan === 'year') {
      var target = new Date(); target.setFullYear(now.getFullYear() - 1);
      keys = keys.filter(function(k) { return new Date(k) >= target; });
    }

    var validData = keys.map(function(k) {
      return {
        date: k,
        w: parseFloat(dayData[k].weight) || null,
        f: parseFloat(dayData[k].fat) || null
      };
    }).filter(function(d) { return d.w !== null || d.f !== null; });

    if (validData.length === 0) {
      container.innerHTML = '<div style="text-align:center; padding-top:100px; color:#999;">データがありません</div>';
      return;
    }

    var width = container.clientWidth || 600;
    var height = 260;
    var padding = 40;

    var wValues = validData.map(function(d) { return d.w; }).filter(function(v) { return v !== null; });
    var fValues = validData.map(function(d) { return d.f; }).filter(function(v) { return v !== null; });

    var minW = wValues.length ? Math.min.apply(nul
